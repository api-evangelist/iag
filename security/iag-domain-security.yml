summary: >-
  Every IAG host is HTTPS-only and presents a valid certificate. The estate
  splits cleanly in two: the Akamai-fronted brand websites negotiate TLS 1.3,
  while all five Apigee gateway virtual hosts negotiate TLS 1.2. HSTS is present
  everywhere except api.iag.co.nz, but the max-age is weak (86400 = 1 day) on
  every Apigee host and on the NRMA, CGU and IAG NZ brand sites; only
  apis.iag.com.au and docs.iag.com.au set a one-year max-age with
  includeSubDomains, and only apis.iag.com.au sets preload. No IAG domain is
  DNSSEC-signed and no IAG domain publishes a CAA record. Email authentication is
  strong and centrally managed — every domain publishes SPF and a DMARC record
  with p=reject reporting to dmarc.reporting@iag.com.au.
