aid: iag
name: Insurance Australia Group
review:
  question: Does Insurance Australia Group publish a public, self-serve developer portal or downloadable API specifications?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: carrier-pc
  gated: true
findings:
  summary: |
    Insurance Australia Group (ASX: IAG) is the largest general insurance
    carrier in Australia and New Zealand. It publishes NO public developer
    portal, NO API reference documentation, and NO downloadable OpenAPI or
    Swagger definitions. Every conventional developer hostname was probed
    across the group domain and its two largest brand domains and none
    resolved to a self-serve developer surface.

    The one real technical signal is an API gateway. api.iag.com.au,
    api.cgu.com.au and api.nrma.com.au all answer, and all answer with an
    Apigee fault body — HTTP 404 with
    {"fault":{"faultstring":"Unable to identify proxy for host: <vhost> and
    url: /","detail":{"errorcode":"messaging.adaptors.http.flow.ApplicationNotFound"}}}
    — naming three distinct Apigee virtual hosts (https_vhost,
    https_cgu_vhost, https_nrma_vhost). That is proof of a production Apigee
    API management layer serving the IAG, CGU and NRMA Insurance brands, and
    equally proof that no proxy on it is exposed at a discoverable public
    path. The gateway is real; the programme around it is private.

    docs.iag.com.au returns HTTP 200 but immediately redirects to
    login.microsoftonline.com (Microsoft Entra ID tenant
    7d847b00-9cb2-4e8b-9f14-fb58de4bcdde, an Azure App Service
    /.auth/login/aad callback). That is an internal corporate documentation
    site behind SSO, not a developer portal, and it is scored as a login
    wall.

    Integration with IAG in this market is achieved through human-facing
    trading portals, not APIs: CGU's PolicyPlace digital quote-and-bind
    platform for brokers (reached through the CGU broker portal), the Ebix
    Sunrise Exchange, and the Steadfast Client Trading Platform (SCTP). IAG
    has stated PolicyPlace is additive to Sunrise and SCTP rather than a
    replacement. The CGU Partner Portal help page directs brokers, advisors
    and partners to email a CGU contact for access — a request-based
    onboarding funnel, which is the sector norm and the opposite of
    self-serve.

    Australia has the legal machinery for open insurance and no live
    obligation. APRA supervises prudentially; the Consumer Data Right that
    already opened banking and energy was flagged for extension to general
    insurance and then paused and de-prioritised, with the government
    focusing on banking, non-bank lending and energy instead. There is
    therefore no forcing function on IAG to publish anything, and it
    publishes nothing.
