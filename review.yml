  gatewayTopology:
    platform: Apigee Edge
    organizations:
    - name: iag-prod
      environment: production
      resolves: iag-prod-production.apigee.net
      virtualHosts:
      - host: api.iag.com.au
        vhost: https_vhost
        brand: IAG group
      - host: api.cgu.com.au
        vhost: https_cgu_vhost
        brand: CGU
      - host: api.nrma.com.au
        vhost: https_nrma_vhost
        brand: NRMA Insurance
      - host: api.wfi.com.au
        vhost: https_wfi_vhost
        brand: WFI
    - name: iag-nonprod
      environment: test
      resolves: iag-nonprod-test.apigee.net
      virtualHosts:
      - host: test-api.iag.com.au
        vhost: https_vhost
    note: >-
      Organisation and environment names are read from the CNAME targets, which
      follow Apigee Edge's <org>-<env>.apigee.net convention. Every virtual host
      answers with the ApplicationNotFound fault at the root: real proxies are
      deployed, none is exposed at a discoverable public path.
  apiProgram:
    integrationPlatform: MuleSoft Anypoint API Experience Hub
    apiCount: ~600
    executive: Lloyd Thomas, Head of Integration, IAG
    agentPosture: >-
      IAG stated an intent to make its APIs "agent aware" and to apply AI
      prompt-driven and agentic tooling to integration engineering, tempered by a
      "measured" approach because of regulatory constraints.
    publiclyReachable: false
    source: https://www.itnews.com.au/news/iag-prepares-integration-engineering-for-ai-624023
    date: '2026-03-10'
    note: >-
      Confirms a substantial internal API estate and an API catalogue/portal
      product deployment. None of it is public: probes of iag.portal.*
      .anypoint.mulesoft.com, apihub/apiportal/experience/anypoint.iag.com.au all
      failed to resolve, and apis.iag.com.au (Akamai) returns 403 for every path.
  securityTxt:
    published: false
    previouslyPublished: true
    format: RFC 9116
    firstSeen: '2023-05-31'
    lastSeen200: '2025-04-01'
    firstSeen404: '2025-05-15'
    contact: cybersecurity@iag.com.au
    expires: 'Wed, 1 Jan 2025 00:00 +1000'
    policyLine: No paid bounties currently offered
    canonicalDomains:
    - www.nrma.com.au
    - www.cgu.com.au
    - www.sgio.com.au
    - www.sgic.com.au
    - www.iag.com.au
    - www.wfi.com.au
    - www.lsvcarinsurance.com.au
    file: well-known/iag-security.txt
    note: >-
      The Expires date had already lapsed while the document was still being
      served, so the final revision was formally stale under RFC 9116 before it
      was withdrawn. sgio.com.au and sgic.com.au also served copies (archived
      200s); cgu.com.au, nrma.com.au and wfi.com.au now return 404.
  vulnerabilityDisclosure:
    published: true
    platform: HackerOne
    url: https://hackerone.com/iag
    handle: iag
    owner: Insurance Australia Group
    ownerWebsite: http://iag.com.au
    paidBounties: false
    verification: >-
      Confirmed against HackerOne's public GraphQL endpoint —
      query { team(handle: "iag") { handle name website } } returns
      {"handle":"iag","name":"Insurance Australia Group","website":"http://iag.com.au"}.
      This disambiguates the programme from International Airlines Group and from
      AIG (hackerone.com/aig).
    note: >-
      MISSED IN ROUND 1. IAG does have a documented disclosure channel; it simply
      is not linked from the corporate site and the security.txt that used to
      point at it has been withdrawn.
  packages:
    firstParty: false
    registriesProbed: [npm, PyPI, GitHub]
    note: >-
      No first-party IAG client library exists on any registry. The npm search for
      IAG/insurance returns unrelated vendors; PyPI "iag-sdk" is a third-party SDK
      for the Itential Automation Gateway, not Insurance Australia Group. The
      InsuranceAustraliaGroup GitHub org holds a single repo, a fork of Google's
      AppAuth-iOS; iagcl (IAG Customer Labs) holds four internal tooling repos
      (data_pipeline, watchmen, bakery, mark59), most marked unmaintained.
    homonymTraps:
    - developer.iairgroup.com — International Airlines Group (British Airways, Iberia)
    - developer.iagloyalty.com — IAG Loyalty (Avios), part of International Airlines Group
    - developers.aig.com — American International Group
    - hackerone.com/aig — AIG, a separate programme
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.iag.com.au
    documented: false
    note: >-
      Apigee-managed gateway confirmed live by its fault signature. No proxy,
      path, or operation is publicly documented.
  - protocol: REST
    scheme: https
    baseURL: https://api.cgu.com.au
    documented: false
    note: Apigee virtual host https_cgu_vhost. Undocumented.
  - protocol: REST
    scheme: https
    baseURL: https://api.nrma.com.au
    documented: false
    note: Apigee virtual host https_nrma_vhost. Undocumented.
  - protocol: GraphQL
    documented: false
    note: No /graphql surface found on any IAG host.
  - protocol: gRPC
    documented: false
    note: No published .proto files found.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No WebSocket endpoint documented.
  acord:
    posture: no ACORD reference found
    detail: >-
      No mention of ACORD, ACORD XML, AL3, NGDS, ACORD certification, or ACORD
      APIs was found in association with IAG or its brands. Australia's
      broker-to-carrier transaction rails are not the ACORD/IVANS stack used in
      North America — they are the Ebix Sunrise Exchange and the Steadfast
      Client Trading Platform (SCTP), plus carrier-specific broker portals such
      as CGU's PolicyPlace. IAG participates in those market rails rather than
      publishing an ACORD-standard interface of its own.
    marketRails:
    - name: Ebix Sunrise Exchange
      role: Broker-to-carrier trading exchange; CGU is connected.
    - name: Steadfast Client Trading Platform (SCTP)
      role: Broker network trading platform; CGU is connected.
    - name: PolicyPlace
      role: >-
        CGU's own digital quote-and-bind front end for brokers, reached through
        the CGU broker portal. Stated by IAG to be additive to Sunrise and SCTP,
        not a replacement. Human-facing platform, no public API.
  verbs:
    quote:
      exposed: false
      audience: agent
      note: >-
        Quote exists for brokers via PolicyPlace, Sunrise and SCTP. Not exposed
        as a public API.
    bind:
      exposed: false
      audience: agent
      note: >-
        Bind exists for brokers via PolicyPlace, Sunrise and SCTP. Not exposed
        as a public API.
    issue:
      exposed: false
      audience: agent
      note: Policy issuance is internal / broker-portal driven. No public API.
    fnol:
      exposed: false
      audience: consumer
      note: >-
        First notice of loss is taken through brand web forms and call centres
        (NRMA Insurance, CGU, State, AMI). No public claims API and no partner
        FNOL API is documented.
  authModel:
    public: none
    observed:
    - scheme: OAuth2 authorization-code (Microsoft Entra ID)
      where: docs.iag.com.au
      note: >-
        Azure App Service Easy Auth against Entra tenant
        7d847b00-9cb2-4e8b-9f14-fb58de4bcdde. Employee/internal SSO, not an
        API authorization server for third parties.
    - scheme: unknown (Apigee-managed)
      where: >-
        api.iag.com.au / api.cgu.com.au / api.nrma.com.au / api.wfi.com.au /
        test-api.iag.com.au
      note: >-
        Apigee normally fronts API-key or OAuth2 client-credentials policies,
        but nothing is published, so no scheme is asserted here.
    - scheme: HTTP Basic (IBM Verify Identity Access for Web)
      where: security.iag.com.au
      note: >-
        NEW 2026-07-25. HTTP 401 with WWW-Authenticate Basic realm "IBM Verify
        Identity Access for Web" — an IBM WebSEAL reverse proxy fronting an
        internal application. Evidence of a second enterprise IAM stack alongside
        Microsoft Entra ID, not a third-party API authorization surface.
    wellKnown:
    - url: https://api.iag.com.au/.well-known/oauth-authorization-server
      status: 404
    - url: https://api.iag.com.au/.well-known/openid-configuration
      status: 404
    - url: https://www.iag.com.au/.well-known/openid-configuration
      status: 403
  webhooks:
    documented: false
    note: No event catalog, webhook documentation, or AsyncAPI definition found.
  postman:
    public: false
    note: No public Postman workspace or collection found for IAG, CGU, or NRMA Insurance.
  openapi:
    harvested: false
    count: 0
    note: >-
      Zero OpenAPI or Swagger documents are published. No openapi/ directory was
      created because nothing real was found to save.
  sourceCode:
    githubOrganizations:
    - url: https://github.com/InsuranceAustraliaGroup
      status: 200
      note: >-
        Official IAG org (Sydney, links to iag.com.au). One public repository, a
        fork of Google's AppAuth-iOS OAuth/OIDC SDK. No API definitions.
    - url: https://github.com/iagcl
      status: 200
      note: >-
        "IAG Customer Labs". Four public repositories — data_pipeline, watchmen,
        bakery, mark59 — all internal platform/engineering tooling, most marked
        unmaintained. No API definitions.
  regulatory:
    regime: APRA prudential supervision; ASIC conduct; General Insurance Code of Practice
    openDataMandate: none
    note: >-
      The Consumer Data Right, which already mandates data sharing in banking
      and energy, was flagged for extension to general insurance and then paused
      and de-prioritised in favour of banking, non-bank lending and energy.
      General insurance is NOT a designated CDR sector. There is no open
      insurance obligation on IAG, and no voluntary equivalent.
