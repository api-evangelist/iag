actions:
  apisYmlUpdated: true
  openapiHarvested: false
  specsSaved: 0
  enrichmentRounds:
  - date: '2026-07-25'
    round: 1
    result: Recorded as an honest stub. Three Apigee virtual hosts identified.
  - date: '2026-07-25'
    round: 2
    result: >-
      Re-ran full contract discovery — still zero specs. Found four things round 1
      missed: a fourth Apigee brand virtual host (api.wfi.com.au /
      https_wfi_vhost), a publicly resolvable non-production Apigee organisation
      (test-api.iag.com.au / iag-nonprod-test), a live HackerOne vulnerability
      disclosure programme, and an RFC 9116 security.txt that IAG published across
      seven brand domains until it was withdrawn in mid-2025 (recovered verbatim).
      Also identified the MuleSoft Anypoint API Experience Hub programme (~600
      APIs), an IBM Verify Identity Access surface at security.iag.com.au, and a
      DMARC misconfiguration on rollin.com.au. Wrote domain-security,
      vulnerability-disclosure, well-known, conformance and llms.txt artifacts.
  reason: >-
    Recorded as an honest stub. IAG operates a real, production Apigee API
    gateway across three brand virtual hosts but publishes no developer portal,
    no reference documentation, no machine-readable specification, no webhook
    catalogue and no public authorization metadata. The only integration paths
    are partner and broker gated. apis[] is intentionally empty because listing
    an undocumented gateway as an API would be fabrication.
