summary: >-
  No /.well-known/ discovery document is served by any live IAG host today. The
  three Apigee-fronted API virtual hosts return the Apigee ApplicationNotFound
  fault (HTTP 404) for every well-known path; the Akamai-fronted brand websites
  return HTTP 403 to non-browser clients for every path other than the document
  root. The one document IAG genuinely did publish is an RFC 9116 security.txt,
  served across the group and brand domains from at least May 2023 until it was
  withdrawn in mid-2025. The last published revision is saved verbatim in this
  directory as iag-security.txt; it is HISTORICAL, not currently served.
